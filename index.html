<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GTM Testing Sandbox</title>

    <!-- 1. INITIALIZE DATALAYER BEFORE GTM -->
    <script>
        window.dataLayer = window.dataLayer || [];
    </script>

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PSP8BH3X');</script>
    <!-- End Google Tag Manager -->

</head>
<body>

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PSP8BH3X"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <header style="text-align: center; padding: 40px; background-color: #f4f4f4;">
        <h1>Welcome to My GTM Testing Site</h1>
        <p>This is my free sandbox website for learning Google Tag Manager!</p>
    </header>

    <main style="max-width: 600px; margin: 40px auto; text-align: center; font-family: sans-serif;">
        <p>Click the buttons below to help me practice tracking custom events.</p>

        <!-- Original Blue Button -->
        <button class="sandbox-btn" id="test-click-btn" data-btn-name="Blue Button - Click Me" style="padding: 15px 30px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">
            Click Me!
        </button>

        <!-- New Red Button -->
        <button class="sandbox-btn" id="test-click-btn-2" data-btn-name="Red Button - Click Me 2" style="padding: 15px 30px; font-size: 16px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Click Me 2!
        </button>
    </main>

    <!-- 2. DATA LAYER EVENT TRACKING -->
    <script>
        document.querySelectorAll('.sandbox-btn').forEach(button => {
            button.addEventListener('click', function() {
                // Grab attributes from the clicked button
                const buttonId = this.id;
                const buttonName = this.getAttribute('data-btn-name');

                // Push custom event data to GTM
                window.dataLayer.push({
                    'event': 'sandbox_button_click',
                    'button_id': buttonId,
                    'button_name': buttonName
                });
            });
        });
    </script>

</body>
</html>
