<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GTM Testing Sandbox</title>

    <!-- 1. INITIALIZE DATALAYER BEFORE GTM/STAPE -->
    <script>
        window.dataLayer = window.dataLayer || [];
    </script>

    <!-- Google Tag Manager (Stape) -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s);j.async=true;
    j.src="https://eqmcgsww.fatehsoorae.github.io/92xzleqmcgsww.js?"+i;
    f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','7=HhNOIDcgXDUkJ0slK14pQwFKQUlS');</script>
    <!-- End Google Tag Manager (Stape) -->

</head>
<body>

    <!-- Google Tag Manager (noscript) (Stape) -->
    <noscript><iframe src="https://eqmcgsww.fatehsoorae.github.io/ns.html?id=GTM-PSP8BH3X"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) (Stape) -->

    <header style="text-align: center; padding: 20px; background-color: #f4f4f4;">
        <h1>Welcome to My GTM Testing Site</h1>
        <p>This is my free sandbox website for learning Google Tag Manager!</p>
    </header>

    <main style="max-width: 600px; margin: 20px auto; text-align: center; font-family: sans-serif;">
        <p>Click the buttons below to help me practice tracking custom events.</p>

        <!-- Original Blue Button -->
        <button type="button" class="sandbox-btn" id="test-click-btn" data-btn-name="Blue Button - Click Me" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Click Me!
        </button>

        <!-- New Red Button -->
        <button type="button" class="sandbox-btn" id="test-click-btn-2" data-btn-name="Red Button - Click Me 2" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Click Me 2!
        </button>

        <br><br><hr><br>

        <!-- Simplified Form -->
        <h2>Lead Capture Form</h2>
        <form id="sandbox-lead-form" style="text-align: left; max-width: 300px; margin: 0 auto;">
            <p>
                <label for="user-name">Full Name:</label><br>
                <input type="text" id="user-name" name="user_name" style="width: 100%; padding: 5px;">
            </p>
            <p>
                <label for="user-number">Phone Number:</label><br>
                <input type="tel" id="user-number" name="user_number" style="width: 100%; padding: 5px;">
            </p>
            <p>
                <label for="user-email">Email Address:</label><br>
                <input type="email" id="user-email" name="user_email" style="width: 100%; padding: 5px;">
            </p>
            <button type="submit" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer;">
                Submit Lead
            </button>
        </form>
    </main>

    <!-- 2. DATA LAYER EVENT TRACKING -->
    <script>
        // Button tracking logic
        document.querySelectorAll('.sandbox-btn').forEach(button => {
            button.addEventListener('click', function() {
                const buttonId = this.id;
                const buttonName = this.getAttribute('data-btn-name');

                window.dataLayer.push({
                    'event': 'sandbox_button_click',
                    'button_id': buttonId,
                    'button_name': buttonName
                });
            });
        });

        // Form tracking logic
        document.getElementById('sandbox-lead-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page reload

            // Get form values
            const name = document.getElementById('user-name').value.trim();
            const number = document.getElementById('user-number').value.trim();
            const email = document.getElementById('user-email').value.trim();

            // Simple validation: If any field is empty, stop completely
            if (name === '' || number === '' || email === '') {
                alert('Please fill out all fields.');
                return;
            }

            // Fire GTM event only on successful validation
            window.dataLayer.push({
                'event': 'lead_form_success',
                'form_name': 'sandbox_lead_form'
            });

            alert('Success! dataLayer event sent.');
            document.getElementById('sandbox-lead-form').reset(); // Clear form
        });
    </script>

</body>
</html>
